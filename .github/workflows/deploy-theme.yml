name: Theme deploy

on:
  push:
    branches: [development, production]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      # 🔑 REQUIRED: Inject Storefront API token at deploy-time
      - name: Inject Storefront API token
        run: |
          sed -i "s|YOUR_STOREFRONT_API_TOKEN_HERE|${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}|g" layout/theme.liquid

      - name: Deploy theme
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          if [ "$BRANCH" = "production" ]; then
            shopify theme push \
              --theme ${{ secrets.PROD_THEME_ID }} \
              --allow-live \
              --ignore config/settings_data.json \
              --ignore templates/*.json \
              --ignore sections/*.json
          else
            shopify theme push \
              --theme ${{ secrets.DEV_THEME_ID }} \
              --ignore config/settings_data.json \
              --ignore templates/*.json \
              --ignore sections/*.json
          fi
